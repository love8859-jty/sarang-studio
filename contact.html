<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예약 문의 · 오시는 길 | 사랑이야기스튜디오 구미</title>
  <meta name="description" content="사랑이야기스튜디오 예약 문의와 오시는 길. 경북 구미 가족사진 전문 사진관.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23a4664c' d='M16 28s-11-7-11-15a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 8-11 15-11 15z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="page-hero plain">
      <div class="ph-text">
        <div class="wrap" style="text-align:center">
          <span class="eyebrow">Reservation</span>
          <h1>예약 문의</h1>
          <p style="margin:12px auto 0">네이버 예약으로 원하는 날짜를 바로 잡으시거나,<br>아래 양식을 적어 보내주시면 확인 후 연락드릴게요.</p>
          <div data-cta-buttons="" style="justify-content:center;margin-top:22px"></div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:60px">
      <div class="wrap" style="max-width:820px">
        <form class="form" id="inquiry" novalidate>
          <div class="form-grid">
            <div class="full">
              <label>어떤 촬영을 원하세요? *</label>
              <div class="chips" id="type-chips"></div>
            </div>
            <div>
              <label for="f-name">성함 *</label>
              <input id="f-name" name="name" required placeholder="홍길동" autocomplete="name">
            </div>
            <div>
              <label for="f-phone">연락처 *</label>
              <input id="f-phone" name="phone" required type="tel" inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">
            </div>
            <div>
              <label for="f-people">인원</label>
              <select id="f-people" name="people">
                <option value="">선택해 주세요</option>
                <option>1명</option><option>2명</option><option>3~4명</option><option>5~7명</option>
                <option>8~10명</option><option>11명 이상</option>
              </select>
            </div>
            <div>
              <label for="f-date">희망 날짜</label>
              <input id="f-date" name="date" type="date">
            </div>
            <div class="full">
              <label for="f-time">희망 시간대</label>
              <select id="f-time" name="time">
                <option value="">상관없음</option><option>오전</option><option>오후</option><option>저녁</option>
              </select>
            </div>
            <div class="full">
              <label for="f-memo">요청 사항</label>
              <textarea id="f-memo" name="memo" placeholder="예) 부모님 칠순 기념 대가족 사진이에요. 아이 2명 포함, 흑백 코디 생각 중입니다."></textarea>
            </div>
          </div>
          <div class="form-actions" id="form-actions"></div>
          <p class="form-help" id="form-help"></p>
        </form>
      </div>
    </section>

    <section class="section white" id="location">
      <div class="wrap">
        <div class="sec-head"><span class="eyebrow">Location</span><h2>오시는 길</h2></div>
        <div class="split" style="align-items:start">
          <div data-map></div>
          <div class="info-list">
            <div class="row"><b>주소</b><div><span data-studio="address"></span><br><span class="small-note" data-studio="addressDetail"></span></div></div>
            <div class="row"><b>전화</b><div><a data-studio="phone-link" href="#"></a></div></div>
            <div class="row"><b>영업시간</b><div data-studio="hours"></div></div>
            <div class="row"><b>주차</b><div data-studio="parking"></div></div>
            <div class="row"><b>대중교통</b><div data-studio="transit"></div></div>
            <div class="row"><b>안내</b><div data-studio="hoursNote"></div></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
