<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>페이지를 옮겼어요 | 사랑이야기스튜디오</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; color: #2b2521; font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #8a7e74; margin: 0 0 24px; }
    a { display: inline-block; background: #a4664c; color: #fff; text-decoration: none; padding: 13px 26px; border-radius: 99px; font-weight: 600; }
  </style>
  <script>
    // 예전 홈페이지(love-story.co.kr · photostudio.kr) 주소로 들어온 손님을 새 페이지로 안내
    (function () {
      var base = location.hostname.endsWith("github.io") ? "/sarang-studio/" : "/";
      var p = (location.pathname + location.search).toLowerCase();
      var map = [
        [/passport|id-photo/, "id-photo.html"],
        [/studio|facility|costume/, "studio.html"],
        [/hid=family|family-photo|70th|memorial/, "family.html"],
        [/hid=wedding|hid=remind|remind-wedding|family-wedding/, "remind.html"],
        [/hid=friend|friendship/, "friends.html"],
        [/hid=hanbok|gallery/, "gallery.html"],
        [/bo_table=product|\/product|events|bo_table=event/, "price.html"],
        [/profile-photo/, "profile.html"],
        [/reservation|contact/, "contact.html"],
        [/bo_table=shooting|\/review|hid=brand|bo_table=brand|about|faq|qna/, "index.html"]
      ];
      var to = "index.html";
      for (var i = 0; i < map.length; i++) { if (map[i][0].test(p)) { to = map[i][1]; break; } }
      document.addEventListener("DOMContentLoaded", function () { document.getElementById("go").href = base + to; });
      setTimeout(function () { location.replace(base + to); }, 1200);
    })();
  </script>
</head>
<body>
  <main>
    <h1>사랑이야기스튜디오 홈페이지가 새로워졌어요</h1>
    <p>찾으시는 내용이 있는 새 페이지로 이동할게요.</p>
    <a id="go" href="/">새 홈페이지로 가기</a>
  </main>
</body>
</html>
